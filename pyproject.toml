[project]
name = "skiwa"
version = "0.1.0"
description = "Browse, install, and scaffold agent skills from a single GitHub repo."
requires-python = ">=3.9"

[project.scripts]
skiwa = "skiwa.cli:main"

[tool.setuptools.package-data]
skiwa = ["assets/*.ans", "assets/*.json", "assets/gh/*"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
