name: Release

# Two ways to run this: push a `v*` tag (builds + publishes a GitHub Release),
# or trigger manually to just build and inspect the artifacts.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

env:
  # Pinned deliberately — bump by hand when a new gh version is wanted, not
  # auto-resolved to "latest" so builds stay reproducible.
  GH_VERSION: "2.101.0"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: macos-arm64
            os: macos-14
            gh_os: macOS
            gh_arch: arm64
            gh_ext: zip
            add_data_sep: ":"
            bin_name: skiwa
            gh_bin_name: gh
            archive_ext: tar.gz
          - id: macos-x64
            os: macos-15-intel
            gh_os: macOS
            gh_arch: amd64
            gh_ext: zip
            add_data_sep: ":"
            bin_name: skiwa
            gh_bin_name: gh
            archive_ext: tar.gz
          - id: linux-x64
            os: ubuntu-22.04
            gh_os: linux
            gh_arch: amd64
            gh_ext: tar.gz
            add_data_sep: ":"
            bin_name: skiwa
            gh_bin_name: gh
            archive_ext: tar.gz
          - id: windows-x64
            os: windows-latest
            gh_os: windows
            gh_arch: amd64
            gh_ext: zip
            add_data_sep: ";"
            bin_name: skiwa.exe
            gh_bin_name: gh.exe
            archive_ext: zip

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash # available on all three runner OSes; keeps steps identical

    steps:
      - uses: actions/checkout@v4

      - name: Stamp version from git tag
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.0-dev"
          fi
          printf '__version__ = "%s"\n' "$version" > skiwa/_version.py
          echo "SKIWA_VERSION=$version" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build deps
        run: |
          pip install --upgrade pip
          pip install pyinstaller .

      - name: Download and verify gh
        run: |
          set -euo pipefail
          asset="gh_${GH_VERSION}_${{ matrix.gh_os }}_${{ matrix.gh_arch }}.${{ matrix.gh_ext }}"
          base="https://github.com/cli/cli/releases/download/v${GH_VERSION}"
          curl -fL -o "$asset" "$base/$asset"
          curl -fL -o checksums.txt "$base/gh_${GH_VERSION}_checksums.txt"
          python .github/scripts/verify_checksum.py "$asset" checksums.txt
          echo "GH_ASSET=$asset" >> "$GITHUB_ENV"

      - name: Unpack gh and bundle it into skiwa/assets
        run: |
          set -euo pipefail
          mkdir -p skiwa/assets/gh
          if [ "${{ matrix.gh_os }}" = "windows" ]; then
            # The windows gh zip has no top-level wrapper dir: bin/gh.exe
            # and LICENSE sit at the archive root, unlike the *nix tarballs.
            unzip -q "$GH_ASSET"
            cp "bin/${{ matrix.gh_bin_name }}" "skiwa/assets/gh/${{ matrix.gh_bin_name }}"
            cp "LICENSE" skiwa/assets/gh/LICENSE
            exit 0
          fi
          tar -xf "$GH_ASSET"
          extracted="gh_${GH_VERSION}_${{ matrix.gh_os }}_${{ matrix.gh_arch }}"
          cp "$extracted/bin/${{ matrix.gh_bin_name }}" "skiwa/assets/gh/${{ matrix.gh_bin_name }}"
          cp "$extracted/LICENSE" skiwa/assets/gh/LICENSE
          chmod +x "skiwa/assets/gh/${{ matrix.gh_bin_name }}"

      - name: Build with PyInstaller
        run: |
          set -euo pipefail
          pyinstaller --onefile --name skiwa \
            --add-data "skiwa/assets${{ matrix.add_data_sep }}skiwa/assets" \
            pyinstaller_entry.py

      - name: Verify smoke test still passes against the source tree
        run: python test_smoke.py

      - name: Package release archive
        run: |
          set -euo pipefail
          stage="stage/skiwa-cli-${{ matrix.id }}"
          mkdir -p "$stage"
          cp "dist/${{ matrix.bin_name }}" "$stage/"
          cp skiwa/assets/gh/LICENSE "$stage/THIRD-PARTY-LICENSE-gh.txt"
          archive="skiwa-cli-${{ matrix.id }}.${{ matrix.archive_ext }}"
          if [ "${{ matrix.archive_ext }}" = "zip" ]; then
            # `zip` isn't guaranteed to be on PATH in Git-bash on windows
            # runners, so build the archive with Python's zipfile instead.
            python -c "
          import pathlib, zipfile
          root = pathlib.Path('stage/skiwa-cli-${{ matrix.id }}')
          with zipfile.ZipFile('$archive', 'w', zipfile.ZIP_DEFLATED) as zf:
              for f in root.rglob('*'):
                  if f.is_file():
                      zf.write(f, f.relative_to('stage'))
          "
          else
            tar -C stage -czf "$archive" "skiwa-cli-${{ matrix.id }}"
          fi
          python -c "
          import hashlib, sys
          data = open('$archive', 'rb').read()
          print(f'{hashlib.sha256(data).hexdigest()}  $archive')
          " > "$archive.sha256"

      - name: Build macOS installer package (.pkg)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          pkgroot="pkgroot-${{ matrix.id }}"
          mkdir -p "$pkgroot/usr/local/bin"
          cp "dist/skiwa" "$pkgroot/usr/local/bin/skiwa"
          chmod +x "$pkgroot/usr/local/bin/skiwa"
          pkg="skiwa-cli-${{ matrix.id }}.pkg"
          pkgbuild \
            --root "$pkgroot" \
            --identifier com.skiwa.cli \
            --version "$SKIWA_VERSION" \
            --install-location / \
            "$pkg"
          python -c "
          import hashlib
          data = open('$pkg', 'rb').read()
          print(f'{hashlib.sha256(data).hexdigest()}  $pkg')
          " > "$pkg.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: skiwa-cli-${{ matrix.id }}
          path: |
            skiwa-cli-${{ matrix.id }}.${{ matrix.archive_ext }}
            skiwa-cli-${{ matrix.id }}.${{ matrix.archive_ext }}.sha256
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: skiwa-cli-${{ matrix.id }}-pkg
          path: |
            skiwa-cli-${{ matrix.id }}.pkg
            skiwa-cli-${{ matrix.id }}.pkg.sha256
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Combine checksums
        run: cat artifacts/*.sha256 > artifacts/SHA256SUMS.txt

      - name: Create release and upload artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # No actions/checkout in this job, so gh can't infer the repo from
          # a local .git dir — pass --repo explicitly on every invocation
          # (and keep GH_REPO as a belt-and-suspenders fallback).
          if gh release view "${{ github.ref_name }}" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" \
              --repo "$GH_REPO" \
              --clobber \
              artifacts/*.zip artifacts/*.tar.gz artifacts/*.pkg artifacts/SHA256SUMS.txt
          else
            gh release create "${{ github.ref_name }}" \
              --repo "$GH_REPO" \
              --title "${{ github.ref_name }}" \
              --generate-notes \
              artifacts/*.zip artifacts/*.tar.gz artifacts/*.pkg artifacts/SHA256SUMS.txt
          fi
